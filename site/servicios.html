<script id="dc-code" type="text/plain">

        text: 'Planificamos, producimos y publicamos el contenido de tus redes, y medimos qué funciona.',

      { name: 'Wedding Content', detail: "Tu casamiento pasa una sola vez, pero el contenido queda para siempre. Capturamos todos los momentos en tiempo real con contenido mobile: natural, espontáneo y listo para compartir desde el día siguiente.", inc: ["Cobertura en tiempo real", "Contenido mobile", "Civil, fiesta e iglesia", "Entrega desde el día siguiente"], photos: [{"poster": "/assets/img/wedding-1.jpg", "video": "/assets/video/wedding-1.mp4"}, {"poster": "/assets/img/wedding-2.jpg", "video": "/assets/video/wedding-2.mp4"}, {"poster": "/assets/img/wedding-3.jpg", "video": "/assets/video/wedding-3.mp4"}],

        text: 'Historias en las que la marca forma parte del contenido, pensadas para que la gente elija verlas.',

    this.closeD = () => this.setState({ detail: null });

    const B = (id, name, h) => ({ name, src: id, style: 'height: ' + h + 'px' });
