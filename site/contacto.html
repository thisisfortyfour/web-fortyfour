              </div>
            </sc-if>

      <div class="ct-ok-orb" aria-hidden="true"><img src="/assets/img/orb5.webp" alt="" draggable="false"></div>
      <div class="ct-ok-in">
        <p style="margin: 0 0 14px; font-size: 13px; color: #9f0c14">{{formName}}</p>
        <h2 style="margin: 0; font-size: clamp(40px, 5.6vw, 84px); line-height: 1; font-weight: 400; letter-spacing: -0.03em">Gracias{{thanksName}}.</h2>
        <p style="margin: 22px auto 0; max-width: 36ch; font-size: 17px; line-height: 1.55" data-cms="contact.thanks">Recibimos tu consulta. Te vamos a escribir a la brevedad.</p>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px">
          <a class="ct-send" href="/" style="text-decoration: none">Ver proyectos <span aria-hidden="true">→</span></a>
          <button class="ct-again" type="button" onClick="{{again}}">Enviar otra consulta</button>
        </div>
      </div>
    </section>
  </sc-if>
</div>
</template>

class Component extends DCLogic {

        fields: [
