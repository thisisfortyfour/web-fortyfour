<noscript><p style="font-family:sans-serif;padding:24px">FORTYFOUR — agencia creativa. Para ver la web activá JavaScript, o escribinos a <a href="mailto:federico@thisisfortyfour.com">federico@thisisfortyfour.com</a>.</p></noscript>
<template id="dc-tpl">

<div class="pg" style="min-height: 100vh; background: #f8f8f6; color: #0b0b0b; font-family: 'Alte Haas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: clip">

    </nav>
  </header>

  <main class="es-grid" ref="{{mainRef}}">
    <h1 class="es-intro" ref="{{introRef}}" data-cms="about.intro">FORTYFOUR es un estudio creativo que integra estrategia, dirección creativa y producción en un mismo proceso.</h1>

    <figure class="es-ph es-ph1">
      <span class="es-num" aria-hidden="true">(01)</span>
      <img data-cms="about.photo1" src="/assets/img/lucian-101.jpg" alt="Campaña Catto by Lucian, retrato en el espejo" draggable="false">
    </figure>

    <div class="es-txt es-t1">
      <p class="es-k" data-cms="about.k1">Origen</p>
      <p data-cms="about.t1">FORTYFOUR nace de la experiencia de su fundador en la producción audiovisual y en más de ocho años como comunicador y creador de contenido. Ese recorrido, junto a marcas, agencias y creadores de las industrias del entretenimiento y la moda, le dio un conocimiento directo de cómo funcionan las plataformas, sus códigos y sus audiencias.</p>
    </div>

    <div class="es-txt es-t2">
      <p class="es-k" data-cms="about.k2">Hoy</p>
      <p data-cms="about.t2">Muchas agencias piensan y otras ejecutan; nosotros hacemos las dos cosas. Definimos la estrategia, desarrollamos el concepto y lo llevamos a la producción y la publicación, acompañando a cada marca hasta el final del proceso. Porque antes de producir, hay que entender qué comunicar, cómo hacerlo y por qué.</p>
    </div>

    <figure class="es-ph es-ph2">
      <span class="es-num" aria-hidden="true">(02)</span>
      <img data-cms="about.photo2" src="/assets/img/lucian-115.jpg" alt="Campaña Catto by Lucian, detalle con copa" draggable="false" loading="lazy" decoding="async">
    </figure>

    <div class="es-txt es-t3">
      <p class="es-k" data-cms="about.k3">Para quién</p>
      <p data-cms="about.t3">Trabajamos con marcas emergentes y consolidadas que buscan una comunicación con identidad propia, desde una mirada local y con proyección internacional.</p>
    </div>

    <div class="es-orbzone" ref="{{zoneRef}}" aria-hidden="true">
      <div class="es-orbmove" ref="{{moveRef}}">
        <div class="es-orb2"><img src="/assets/img/orb5.webp" alt="" draggable="false"></div>
      </div>

  </main>

  <section class="es-mf" ref="{{mfRef}}" aria-labelledby="es-mf-t">
    <p class="es-mf-k" data-cms="about.mf_label">Manifiesto</p>
    <h2 id="es-mf-t" class="es-mf-claim" data-cms="about.mf_claim">Pensamos. Creamos. Movemos.</h2>
    <div class="es-mf-grid">
      <p data-cms="about.mf_p1" class="es-mf-p" style="grid-column: 1 / span 2">Creemos que las buenas ideas no aparecen de la nada. Nacen de observar, de cuestionar, de conectar puntos y de encontrar nuevas formas de mirar lo que nos rodea.</p>
      <p data-cms="about.mf_p2" class="es-mf-p" style="grid-column: 4 / span 2; margin-top: clamp(48px, 6vw, 96px)">Creemos en la creatividad con intención. En las ideas que tienen algo que decir, en las decisiones que tienen un porqué y en los proyectos que no se conforman con hacer lo mismo de siempre.</p>
      <p data-cms="about.mf_p3" class="es-mf-p" style="grid-column: 2 / span 2">Nos mueve la curiosidad. Lo que pasa en la cultura, lo que cambia en el mundo, las nuevas formas de comunicar y todo aquello que todavía está por descubrirse.</p>
      <p data-cms="about.mf_p4" class="es-mf-p" style="grid-column: 5 / span 2; margin-top: clamp(64px, 8vw, 120px)">No creemos en las fórmulas. Creemos en entender cada contexto, encontrar su esencia y construir una mirada propia. Porque no todas las marcas necesitan lo mismo, ni todas las ideas merecen resolverse de la misma manera.</p>
      <p data-cms="about.mf_p5" class="es-mf-p" style="grid-column: 1 / span 2; margin-top: clamp(16px, 2vw, 32px)">Pensamos antes de hacer. Exploramos antes de definir. Creamos con criterio y llevamos cada idea más allá del concepto.</p>
      <p data-cms="about.mf_p6" class="es-mf-p" style="grid-column: 4 / span 2; margin-top: clamp(80px, 9vw, 140px)">Integramos estrategia, creatividad y ejecución en un mismo proceso. Desde la primera conversación hasta el último detalle, entendemos cada proyecto como una oportunidad para construir algo que tenga sentido, personalidad y conexión con las personas.</p>
      <p data-cms="about.mf_p7" class="es-mf-p" style="grid-column: 2 / span 2">Nos gusta experimentar, probar, equivocarnos y volver a empezar. Evolucionar es parte de nuestra naturaleza. Porque quedarse quietos nunca fue una opción.</p>
      <p data-cms="about.mf_p8" class="es-mf-p" style="grid-column: 5 / span 2; margin-top: clamp(56px, 7vw, 110px)">Somos un punto de encuentro entre ideas, personas y perspectivas. Un espacio donde distintas miradas se complementan para transformar posibilidades en realidades.</p>
    </div>
    <p class="es-mf-end es-mf-p" data-cms="about.mf_end">No buscamos hacer más de lo mismo.<br>Buscamos encontrar nuevas maneras de hacerlo.</p>
    <p class="es-mf-sign" data-cms="about.mf_sign">FORTYFOUR®<br>Creative Studio.</p>
  </section>

      <a href="https://instagram.com/thisisfortyfour" data-cms="contact.instagram_label" data-cms-href="contact.instagram_href">Instagram @thisisfortyfour</a>

<script id="dc-code" type="text/plain">
class Component extends DCLogic {
  componentDidMount() {
    this.orbStart();
    // Manifesto lines turn from grey to black as they scroll into view.
    const root = this.mf;
    if (!root) return;
    const ps = root.querySelectorAll('.es-mf-p');
    if (typeof IntersectionObserver === 'undefined') { ps.forEach((p) => p.classList.add('on')); return; }
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('on'); this.io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -30% 0px', threshold: 0.2 });
    ps.forEach((p) => this.io.observe(p));
  }

  // The orb starts at the top right, next to the intro, and drifts down an S-shaped path to its place as the page scrolls.
  orbStart() {
    if (typeof window === 'undefined') return;
    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.cur = 0;
    this.measure = () => {
      const m = this.mainEl, z = this.zoneEl, it = this.introEl;
      if (!m || !z || !it) return;
      const sy = window.scrollY || 0, mr = m.getBoundingClientRect(), zr = z.getBoundingClientRect(), ir = it.getBoundingClientRect();
      const ex = zr.left + zr.width / 2, ey = zr.top + zr.height / 2 + sy;
      const narrow = mr.width < 820;
      const sx = mr.left + mr.width * (narrow ? 0.7 : 0.8), syy = ir.top + sy + ir.height * (narrow ? 0.2 : 0.55);
      this.dx = sx - ex; this.dy = syy - ey;
      this.end = Math.max(1, ey - window.innerHeight * 0.55);
      this.s0 = narrow ? 0.5 : 0.62;
    };
    this.tick = () => {
      this.raf = requestAnimationFrame(this.tick);
      const el = this.moveEl;
      if (!el || this.dx == null) return;
      const goal = this.reduced ? 1 : Math.min(1, Math.max(0, (window.scrollY || 0) / this.end));
      this.cur += (goal - this.cur) * 0.07;
      if (Math.abs(goal - this.cur) < 0.0005) this.cur = goal;
      const t = this.cur, e = t * t * (3 - 2 * t), left = 1 - e;
      const len = Math.hypot(this.dx, this.dy) || 1, nx = -this.dy / len, ny = this.dx / len;
      const wob = Math.sin(Math.PI * t) * len * 0.22 + Math.sin(Math.PI * 3 * t) * len * 0.04;
      const x = this.dx * left + nx * wob, y = this.dy * left + ny * wob, s0 = this.s0 || 0.62, sc = s0 + (1 - s0) * e;
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + sc.toFixed(3) + ')';
    };
    this.onResize = () => this.measure();
    window.addEventListener('resize', this.onResize);
    window.addEventListener('load', this.onResize);
    this.measure();
    setTimeout(this.onResize, 300); setTimeout(this.onResize, 1200);
    this.tick();
  }

  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.onResize) { window.removeEventListener('resize', this.onResize); window.removeEventListener('load', this.onResize); }
  }

  renderVals() {
    if (!this.mfRef) {
      this.mfRef = (el) => { this.mf = el; };
      this.mainRef = (el) => { this.mainEl = el; };
      this.introRef = (el) => { this.introEl = el; };
      this.zoneRef = (el) => { this.zoneEl = el; };
      this.moveRef = (el) => { this.moveEl = el; };
    }
    return { mfRef: this.mfRef, mainRef: this.mainRef, introRef: this.introRef, zoneRef: this.zoneRef, moveRef: this.moveRef };
  }
}
